{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALVIX - Welcome Back</title>

<style>
    :root {
        --green-900: #064e3b;
        --green-800: #065f46;
        --green-700: #047857;
        --gold: #d4af37;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f2f6f4;
        background-image:
            radial-gradient(at 0% 0%, rgba(212, 175, 55, 0.12) 0px, transparent 50%),
            radial-gradient(at 100% 100%, rgba(6, 78, 59, 0.25) 0px, transparent 50%);
        padding: 24px 16px;
        position: relative;
        overflow-x: hidden;
    }

    /* Ambient background glows */
    body::before,
    body::after {
        content: '';
        position: fixed;
        border-radius: 50%;
        filter: blur(90px);
        z-index: 0;
        pointer-events: none;
    }

    body::before {
        width: 380px;
        height: 380px;
        top: 10%;
        left: 12%;
        background: radial-gradient(circle, rgba(212, 175, 55, 0.2), transparent 70%);
        animation: drift 9s ease-in-out infinite alternate;
    }

    body::after {
        width: 420px;
        height: 420px;
        bottom: 6%;
        right: 10%;
        background: radial-gradient(circle, rgba(6, 78, 59, 0.45), transparent 70%);
        animation: drift 11s ease-in-out infinite alternate-reverse;
    }

    @keyframes drift {
        0%   { transform: translate(0, 0) scale(1); }
        100% { transform: translate(20px, -20px) scale(1.12); }
    }

    @keyframes rise {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    /* Login card: NEW soft cream-to-mint background, golden border kept */
    .login-card {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 440px;
        background:
            radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.18) 0%, transparent 55%),
            linear-gradient(160deg, #fffdf6 0%, #f1f7f4 55%, #e1f0e8 100%);
        border: 2px solid var(--gold);
        border-radius: 26px;
        padding: 42px 40px 36px;
        color: var(--green-900);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4),
                    0 0 24px rgba(212, 175, 55, 0.2);
        animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    /* Gold accent line on top edge */
    .login-card::before {
        content: '';
        position: absolute;
        top: -2px;
        left: 50%;
        transform: translateX(-50%);
        width: 110px;
        height: 4px;
        border-radius: 0 0 6px 6px;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .logo {
        text-align: center;
        margin-bottom: 28px;
    }

    .logo-circle {
        width: 88px;
        height: 88px;
        margin: 0 auto 16px auto;
        border-radius: 50%;
        background: #fcfbf7;
        border: 2px solid var(--gold);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 11px;
        box-shadow: 0 0 0 6px rgba(212, 175, 55, 0.14),
                    0 6px 16px rgba(212, 175, 55, 0.25);
    }

    .logo-circle img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
    }

    h2 {
        text-align: center;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: var(--green-900);
        margin-bottom: 6px;
        -webkit-text-stroke: 1.2px var(--gold);
        paint-order: stroke fill;
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.25);
    }

    .subtitle {
        text-align: center;
        font-size: 14px;
        color: var(--green-700);
        line-height: 1.5;
        font-weight: 500;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 700;
        color: var(--green-900);
        letter-spacing: 0.2px;
    }

    /* Input with icon */
    .input-wrap {
        position: relative;
    }

    .input-wrap > svg.icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        width: 18px;
        height: 18px;
        stroke: var(--green-700);
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        pointer-events: none;
        opacity: 0.8;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
        width: 100%;
        height: 50px;
        padding: 0 46px 0 44px;
        background: #ffffff;
        border: 1.5px solid #cfe0d8;
        border-radius: 12px;
        outline: none;
        font-size: 14px;
        color: var(--green-900);
        transition: all 0.2s ease;
    }

    input::placeholder {
        color: #94a3b8;
    }

    input[type="email"]:focus,
    input[type="password"]:focus,
    input[type="text"]:focus {
        border-color: var(--gold);
        box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.22);
    }

    /* Show / hide password */
    .toggle-pass {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        width: 36px;
        height: 36px;
        border: none;
        background: transparent;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s ease;
    }

    .toggle-pass:hover {
        background: rgba(6, 78, 59, 0.08);
    }

    .toggle-pass:focus-visible {
        outline: 2px solid var(--gold);
    }

    .toggle-pass svg {
        width: 18px;
        height: 18px;
        stroke: var(--green-700);
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .remember {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 20px 0 24px 0;
    }

    .remember input[type="checkbox"] {
        width: 17px;
        height: 17px;
        accent-color: var(--green-900);
        cursor: pointer;
    }

    .remember label {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
    }

    .login-btn {
        width: 100%;
        height: 52px;
        border: 1px solid var(--gold);
        border-radius: 12px;
        background: linear-gradient(135deg, var(--green-900), var(--green-700));
        color: #ffffff;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.3px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 10px 25px -5px rgba(6, 78, 59, 0.4);
    }

    .login-btn svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: transform 0.3s ease;
    }

    .login-btn:hover {
        background: linear-gradient(135deg, var(--green-700), var(--green-800));
        transform: translateY(-2px);
        box-shadow: 0 15px 30px -5px rgba(6, 78, 59, 0.5),
                    0 0 14px rgba(212, 175, 55, 0.35);
    }

    .login-btn:hover svg {
        transform: translateX(4px);
    }

    .login-btn:active {
        transform: translateY(0);
    }

    .login-btn:focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 3px;
    }

    .error {
        margin-top: 18px;
        padding: 12px 16px;
        border-radius: 12px;
        text-align: center;
        font-size: 13px;
        font-weight: 600;
        background: #fef2f2;
        border: 1px solid #fca5a5;
        color: #991b1b;
    }

    .divider {
        height: 1px;
        margin: 26px 0 0;
        background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.6), transparent);
    }

    .signup {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: var(--green-900);
    }

    .signup a {
        color: var(--green-700);
        font-weight: 700;
        text-decoration: none;
        border-bottom: 1.5px solid var(--gold);
        padding-bottom: 1px;
        transition: all 0.2s ease;
    }

    .signup a:hover {
        color: var(--green-900);
        border-bottom-color: var(--green-900);
    }

    @media (max-width: 480px) {
        .login-card { padding: 34px 22px 30px; border-radius: 22px; }
        h2 { font-size: 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation: none !important;
            transition: none !important;
        }
    }
</style>

</head>

<body>

<div class="login-card">

    <div class="logo">
        <div class="logo-circle">
            <img src="{% static 'images/LOGO.alvix.png' %}" alt="ALVIX Logo">
        </div>
        <h2>Welcome Back</h2>
        <p class="subtitle">Continue your AI-powered learning journey</p>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="email">User Email</label>
            <div class="input-wrap">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>
                </svg>
                <input type="email" id="email" name="email" placeholder="Enter your email"
                       autocomplete="email" required>
            </div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrap">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
                </svg>
                <input type="password" id="password" name="password" placeholder="Enter password"
                       autocomplete="current-password" required>
                <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="remember">
            <input type="checkbox" name="remember_account" id="remember_account">
            <label for="remember_account">Remember me</label>
        </div>

        <button type="submit" class="login-btn">
            Login
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
    </form>

    {% if error %}
    <div class="error" role="alert">
        {{ error }}
    </div>
    {% endif %}

    <div class="divider"></div>

    <div class="signup">
        Don't have an account?
        <a href="{% url 'signup' %}">Sign Up</a>
    </div>

</div>

<script>
    (function () {
        var btn = document.getElementById('togglePass');
        var input = document.getElementById('password');
        btn.addEventListener('click', function () {
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        });
    })();
</script>

</body>
</html>
